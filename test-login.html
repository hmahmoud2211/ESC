<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - ESC Fit Club</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Test Login for ESC Fit Club Admin</h1>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" value="admin@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" value="admin123" required>
        </div>
        
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>
    
    <div style="margin-top: 30px;">
        <h3>Instructions:</h3>
        <ol>
            <li>Click "Login" to authenticate with the admin credentials</li>
            <li>If successful, the tokens will be stored in localStorage</li>
            <li>Then you can go to <a href="admin/products.html">admin/products.html</a> to test the admin panel</li>
        </ol>
        
        <h3>Current Token Status:</h3>
        <div id="tokenStatus"></div>
        
        <button onclick="clearTokens()" style="background: #dc3545; margin-top: 10px;">Clear All Tokens</button>
        <button onclick="checkTokens()" style="background: #28a745; margin-top: 10px;">Check Current Tokens</button>
    </div>

    <script>
        // Check token status on page load
        window.onload = function() {
            checkTokens();
        };

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');
            
            try {
                result.innerHTML = '<div class="result">Logging in...</div>';
                
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store tokens with both key formats for compatibility
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('escwear_auth_token', data.token);
                    localStorage.setItem('escwear_user', JSON.stringify(data.user));
                    
                    result.innerHTML = `
                        <div class="result success">
                            <h3>Login Successful!</h3>
                            <p><strong>Name:</strong> ${data.user.name}</p>
                            <p><strong>Email:</strong> ${data.user.email}</p>
                            <p><strong>Role:</strong> ${data.user.role}</p>
                            <p><strong>Token:</strong> ${data.token.substring(0, 20)}...</p>
                            <p><a href="admin/products.html" style="color: #155724; font-weight: bold;">→ Go to Admin Panel</a></p>
                        </div>
                    `;
                    checkTokens();
                } else {
                    result.innerHTML = `
                        <div class="result error">
                            <h3>Login Failed</h3>
                            <p>${data.msg || 'Unknown error'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="result error">
                        <h3>Error</h3>
                        <p>${error.message}</p>
                        <p><strong>Tip:</strong> Make sure the backend server is running on port 5000</p>
                    </div>
                `;
            }
        });
        
        function clearTokens() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('escwear_auth_token');
            localStorage.removeItem('escwear_user');
            checkTokens();
            document.getElementById('result').innerHTML = '<div class="result success">All tokens cleared!</div>';
        }
        
        function checkTokens() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            const escToken = localStorage.getItem('escwear_auth_token');
            const escUser = localStorage.getItem('escwear_user');
            
            const status = document.getElementById('tokenStatus');
            
            let html = '<ul>';
            html += `<li><strong>token:</strong> ${token ? 'EXISTS ✓' : 'NOT FOUND ✗'}</li>`;
            html += `<li><strong>user:</strong> ${user ? 'EXISTS ✓' : 'NOT FOUND ✗'}</li>`;
            html += `<li><strong>escwear_auth_token:</strong> ${escToken ? 'EXISTS ✓' : 'NOT FOUND ✗'}</li>`;
            html += `<li><strong>escwear_user:</strong> ${escUser ? 'EXISTS ✓' : 'NOT FOUND ✗'}</li>`;
            html += '</ul>';
            
            if (token && user) {
                try {
                    const userData = JSON.parse(user);
                    html += `<p><strong>Current User:</strong> ${userData.name} (${userData.email}) - Role: ${userData.role}</p>`;
                } catch (e) {
                    html += '<p><strong>Warning:</strong> User data is corrupted</p>';
                }
            }
            
            status.innerHTML = html;
        }
    </script>
</body>
</html>
